<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jurnal Perjalanan Kita</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html" style="font-family: 'Pacifico', cursive;">Vania's Birthday</a>
        <a href="index.html" class="btn btn-outline-pink ms-auto">
          <i class="bi bi-arrow-left"></i> Kembali ke Home
        </a>
      </div>
    </nav>

    <header class="py-5 text-center text-white" style="background-color: #ffafcc;">
      <div class="container">
        <h1 class="display-4" data-aos="fade-down">Jurnal Petualangan Kita</h1>
        <p class="lead" data-aos="fade-up">Koleksi cerita dan foto dari setiap perjalanan indah bersamamu.</p>
      </div>
    </header>

    <section id="journey-content" class="py-5">
      <div class="container">
        
        <div class="row mb-5 justify-content-center">
            <div class="col-md-8 text-center" data-aos="zoom-in">
                <button class="btn btn-custom btn-lg shadow" data-bs-toggle="modal" data-bs-target="#addTripModal">
                    <i class="bi bi-plus-circle-fill"></i> Tambah Cerita Baru
                </button>
            </div>
        </div>

        <div id="journey-list" class="row">
            <div class="col-12 text-center mt-5">
                <div class="spinner-border text-pink" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2 text-muted">Mengambil kenangan...</p>
            </div>
        </div>

      </div>
    </section>

    <div class="modal fade" id="addTripModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-light">
            <h5 class="modal-title" style="font-family: 'Pacifico', cursive;">Simpan Kenangan Baru</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="journey-form">
                <div class="mb-3">
                  <label class="form-label">Judul Perjalanan</label>
                  <input type="text" id="trip-title" class="form-control" placeholder="Contoh: Liburan ke Bali" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Tanggal</label>
                  <input type="date" id="trip-date" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Cerita Singkat</label>
                  <textarea id="trip-desc" class="form-control" rows="4" placeholder="Ceritain momen paling seru..." required></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label">Foto Kenangan Utama</label>
                  <input type="file" id="trip-image" class="form-control" accept="image/*" required>
                </div>
                
                <div class="progress mb-3 d-none" id="upload-progress-container">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-pink" role="progressbar" style="width: 0%"></div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-custom" id="btn-save-trip">
                        <i class="bi bi-cloud-upload-fill"></i> Simpan Sekarang
                    </button>
                </div>
              </form>
          </div>
        </div>
      </div>
    </div>

    <footer class="py-4 text-center mt-5 bg-dark text-white">
      <div class="container">
        <p class="mb-0">Dibuat dengan <i class="bi bi-heart-fill text-pink"></i> untuk Masa Depan Kita</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <script type="module" src="script.js"></script>
  </body>
</html>
